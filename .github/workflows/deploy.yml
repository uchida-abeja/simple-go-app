name: Build Image and Update Manifest

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/uchida-abeja/simple-go-app
  MANIFEST_REPO: uchida-abeja/learn-k8s
  OVERLAY_PATH: apps/simple-go-app/overlays/dev
  KUSTOMIZE_VERSION: 5.8.1
  KUSTOMIZE_SHA256: 029a7f0f4e1932c52a0476cf02a0fd855c0bb85694b82c338fc648dcb53a819d

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout application repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Run tests
        shell: bash
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -w /workspace \
            golang:1.26.5-alpine3.24@sha256:0178a641fbb4858c5f1b48e34bdaabe0350a330a1b1149aabd498d0699ff5fb2 \
            go test ./...

  build-and-push:
    needs:
      - test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.image.outputs.tag }}
    steps:
      - name: Checkout application repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set image tag
        id: image
        shell: bash
        run: echo "tag=${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-platform image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.image.outputs.tag }}
            ${{ env.IMAGE_NAME }}:latest
          sbom: true
          provenance: mode=max

  update-manifest:
    needs:
      - build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
    steps:
      - name: Checkout manifest repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ env.MANIFEST_REPO }}
          ref: main
          ssh-key: ${{ secrets.GITOPS_DEPLOY_KEY }}
          # The later git push needs this SSH credential; this job uploads no artifacts.
          persist-credentials: true # zizmor: ignore[artipacked]
          path: manifests
          fetch-depth: 0

      - name: Install checksum-verified Kustomize
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/kustomize-bin"
          ARCHIVE="kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          curl -fsSLo "${RUNNER_TEMP}/${ARCHIVE}" \
            "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/${ARCHIVE}"
          printf '%s  %s\n' \
            "${KUSTOMIZE_SHA256}" \
            "${RUNNER_TEMP}/${ARCHIVE}" \
            | sha256sum --check -
          tar -xzf "${RUNNER_TEMP}/${ARCHIVE}" \
            -C "${RUNNER_TEMP}/kustomize-bin"
          chmod 0755 "${RUNNER_TEMP}/kustomize-bin/kustomize"
          echo "${RUNNER_TEMP}/kustomize-bin" >> "${GITHUB_PATH}"

      - name: Update deployment pull request branch
        working-directory: manifests
        shell: bash
        run: |
          set -euo pipefail

          BRANCH="deploy/simple-go-app"
          REMOTE_SHA="$(
            git ls-remote --heads origin "refs/heads/${BRANCH}" \
              | awk 'NR == 1 { print $1 }'
          )"

          # Keep the bot-only branch based on the latest main.
          git switch -C "${BRANCH}" origin/main

          (
            cd "${OVERLAY_PATH}"
            kustomize edit set image \
              "simple-go-app-image=${IMAGE_NAME}:${IMAGE_TAG}"
          )
          git diff --check

          if git diff --quiet; then
            echo "Manifest already points to ${IMAGE_TAG}; no update is required."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${OVERLAY_PATH}/kustomization.yaml"
          git commit -m "Deploy simple-go-app ${IMAGE_TAG}"

          if [ -n "${REMOTE_SHA}" ]; then
            git push \
              --force-with-lease="refs/heads/${BRANCH}:${REMOTE_SHA}" \
              origin "HEAD:refs/heads/${BRANCH}"
          else
            git push --set-upstream origin "${BRANCH}"
          fi
